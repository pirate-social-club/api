pre_plan:
  - action: http_get
    items:
      - url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.10/bun-linux-x64.zip
        filename: bun-runtime.zip
  - action: bun_get
    path: services/shared
    output: shared
  - action: bun_get
    path: services/contracts
    output: contracts
plan:
  - action: shell
    shell: |
      set -euo pipefail
      cache=/ci/cache/bun
      bun_runtime="${cache}-runtime/bun"
      bunfig=/ci/bunfig.toml
      mkdir -p "$cache"
      if [[ ! -x "$bun_runtime" ]]; then
        runtime_sha256=f57bc0187e39623de716ba3a389fda5486b2d7be7131a980ba54dc7b733d2e08
        echo "$runtime_sha256  /ci/deps/bun-runtime.zip" | sha256sum -c -
        temp=$(mktemp -d "$cache/.bun-runtime.XXXXXX")
        unzip -q /ci/deps/bun-runtime.zip -d "$temp"
        install -d "$(dirname "$bun_runtime")"
        install -m 0755 "$temp/bun-linux-x64/bun" "$bun_runtime"
        rm -rf -- "$temp"
      fi
      bun="$bun_runtime"
      test "$("$bun" --version)" = 1.3.10
      cat > "$bunfig" <<'EOF'
      [install]
      prefer = "offline"
      EOF

      import_bun_cache() {
        local root="$1"
        local manifest="/ci/deps/bun/$root/manifest.tsv"
        while IFS=$'\t' read -r name version archive integrity; do
          [[ "$name" == "name" ]] && continue
          : "$integrity"
          [[ -n "$name" && -n "$version" && -n "$archive" ]]
          local target="$cache/$name@$version@@@1"
          if [[ -f "$target/package.json" ]]; then
            continue
          fi
          [[ ! -e "$target" ]] || {
            echo "incomplete Bun cache entry exists: $target" >&2
            exit 1
          }
          local archive_path="/ci/deps/bun/$root/$archive"
          if [[ "$integrity" == sha512-* ]]; then
            local actual_integrity
            actual_integrity="sha512-$(openssl dgst -sha512 -binary "$archive_path" | base64 -w0)"
            [[ "$actual_integrity" == "$integrity" ]] || {
              echo "Bun cache integrity mismatch: $archive" >&2
              exit 1
            }
          fi
          local temp
          temp=$(mktemp -d "$cache/.extract.XXXXXX")
          tar -xzf "$archive_path" -C "$temp"
          local package_json
          package_json=$(find "$temp" -mindepth 1 -maxdepth 3 -type f -name package.json -print -quit)
          [[ -n "$package_json" ]]
          local package_dir="${package_json%/package.json}"
          [[ "$package_dir" != "$temp" ]]
          mkdir -p "$(dirname "$target")"
          mv "$package_dir" "$target"
          rm -rf -- "$temp"
        done < "$manifest"
      }

      import_bun_cache shared
      import_bun_cache contracts

      cd /ci/src/services/shared
      "$bun" install --frozen-lockfile --ignore-scripts --cache-dir "$cache" --config "$bunfig"
      "$bun" run check

      cd /ci/src/services/contracts
      "$bun" install --frozen-lockfile --ignore-scripts --cache-dir "$cache" --config "$bunfig"
      "$bun" run check
