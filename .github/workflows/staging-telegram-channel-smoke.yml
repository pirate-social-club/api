name: staging-telegram-channel-smoke

# This is the real transport synthetic. It reuses the already-connected staging
# fixture, creates one text post, deterministically dispatches the real queued
# handler and Bot API, then deletes both the Telegram message and Pirate post.
# Scheduler cadence is tested separately; a lost send response fails closed in
# `uncertain` and never retries into a duplicate.
on:
  workflow_dispatch:
    inputs:
      community_id:
        description: "Optional com_cmt_... fixture; blank requires exactly one active channel"
        required: false
        type: string
  schedule:
    # Offset from the top of the hour to avoid the busiest shared scheduler
    # window and daily release jobs.
    - cron: "17 6 * * *"

concurrency:
  group: staging-telegram-channel-smoke
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  real-telegram-delivery:
    name: Real Telegram channel delivery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIRATE_ADMIN_OPERATOR_CREDENTIAL: ""
      PIRATE_SMOKE_API_BASE_URL: https://api-staging.pirate.sc
      PIRATE_TELEGRAM_SMOKE_COMMUNITY_ID: ${{ inputs.community_id || vars.PIRATE_TELEGRAM_SMOKE_COMMUNITY_ID }}
      PIRATE_TELEGRAM_SMOKE_TIMEOUT_MS: "1200000"
      PIRATE_TELEGRAM_SMOKE_DISPATCH_MODE: deterministic

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: api

      - name: Read compatible Core commit
        working-directory: api
        run: echo "CORE_SHA=$(<.github/ci-refs/core.sha)" >> "$GITHUB_ENV"

      - name: Check out compatible Core
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ env.CORE_SHA }}
          path: core

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Fetch staging admin secret material
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: PIRATE_ADMIN_TOKEN
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Build scoped admin credential
        shell: bash
        run: |
          credential="opc_admin_automation.${PIRATE_ADMIN_TOKEN}"
          echo "::add-mask::$credential"
          printf 'PIRATE_ADMIN_OPERATOR_CREDENTIAL=%s\n' "$credential" >> "$GITHUB_ENV"

      - name: Install shared dependencies
        working-directory: api/services/shared
        run: bun install --frozen-lockfile

      - name: Install API dependencies
        working-directory: api/services/api
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Verify real Telegram delivery and cleanup
        working-directory: api/services/api
        run: bun run smoke:telegram-channel
