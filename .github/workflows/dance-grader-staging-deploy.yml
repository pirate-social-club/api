name: Dance grader staging deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dance-grader-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      DANCE_GRADER_DEPLOY_TAG: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.12

      - name: Install locked grader dependencies
        working-directory: services/dance-grader
        run: uv sync --frozen --extra dev --extra service

      - name: Verify grader source
        working-directory: services/dance-grader
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Validate configuration and deploy staging
        working-directory: services/dance-grader
        run: ./scripts/deploy_staging.sh

      - name: Record deployment
        run: |
          {
            echo "## Dance grader staging deployment"
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Modal environment: \`staging\`"
            echo "- App: \`pirate-dance-grader\`"
          } >> "${GITHUB_STEP_SUMMARY}"
