name: api-ci

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/dance-grader-staging-deploy.yml"
      - ".github/workflows/staging-contract-gate.yml"
      - ".github/workflows/staging-telegram-channel-cadence.yml"
      - ".github/workflows/staging-telegram-channel-smoke.yml"
      - ".github/ci-refs/core.sha"
      - ".github/ci-refs/web.sha"
      - "services/api/**"
      - "services/cli/**"
      - "services/community-d1-shard/**"
      - "services/contracts/**"
      - "services/dance-grader/**"
      - "services/shared/**"
      - "services/song-preview-container/**"
      - "services/song-preview-runtime/**"
      - "services/story-controlled-inclusion-harness/**"
      - "services/zkpassport-verifier-container/**"
      - "services/zkpassport-verifier-runtime/**"
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/dance-grader-staging-deploy.yml"
      - ".github/workflows/staging-contract-gate.yml"
      - ".github/workflows/staging-telegram-channel-cadence.yml"
      - ".github/workflows/staging-telegram-channel-smoke.yml"
      - ".github/ci-refs/core.sha"
      - ".github/ci-refs/web.sha"
      - "services/api/**"
      - "services/cli/**"
      - "services/community-d1-shard/**"
      - "services/contracts/**"
      - "services/dance-grader/**"
      - "services/shared/**"
      - "services/song-preview-container/**"
      - "services/song-preview-runtime/**"
      - "services/story-controlled-inclusion-harness/**"
      - "services/zkpassport-verifier-container/**"
      - "services/zkpassport-verifier-runtime/**"
  workflow_dispatch:
    inputs:
      core_sha:
        description: Full Core commit SHA to test instead of the committed CI pin
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: api-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-provenance:
    name: Resolve CI provenance
    runs-on: ubuntu-latest
    outputs:
      reuse_merge_group: ${{ steps.merge-group.outputs.reuse }}
    steps:
      - name: Reuse successful merge-queue verification for the exact main SHA
        id: merge-group
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            core.setOutput("reuse", "false");

            if (context.eventName !== "push" || context.ref !== "refs/heads/main") {
              core.notice("Full CI required: this is not a push to main.");
              return;
            }

            let data;
            try {
              ({ data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "api-ci.yml",
                event: "merge_group",
                head_sha: context.sha,
                status: "success",
                per_page: 20,
              }));
            } catch (error) {
              core.warning(`Could not verify merge-group provenance; running full CI: ${error.message}`);
              return;
            }

            const source = data.workflow_runs.find((run) =>
              run.event === "merge_group" &&
              run.conclusion === "success" &&
              run.head_sha === context.sha &&
              run.path === ".github/workflows/api-ci.yml" &&
              run.head_branch?.startsWith("gh-readonly-queue/main/")
            );

            if (!source) {
              core.notice(`Full CI required: no successful main merge-group run proves ${context.sha}.`);
              return;
            }

            core.setOutput("reuse", "true");
            core.notice(`Reusing exact-SHA merge-group verification from ${source.html_url}.`);
            await core.summary
              .addHeading("API CI provenance")
              .addRaw(`Reused successful main merge-group run [${source.id}](${source.html_url}) for exact SHA \`${context.sha}\`.`)
              .write();

  ci-inputs:
    name: Resolve CI inputs
    needs: ci-provenance
    if: needs.ci-provenance.outputs.reuse_merge_group != 'true'
    runs-on: ubuntu-latest
    outputs:
      core_sha: ${{ steps.core-ref.outputs.sha }}
      web_sha: ${{ steps.web-ref.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Resolve Core commit
        id: core-ref
        shell: bash
        env:
          REQUESTED_CORE_SHA: ${{ inputs.core_sha }}
        run: |
          pinned_core_sha="$(< .github/ci-refs/core.sha)"
          core_sha="${REQUESTED_CORE_SHA:-$pinned_core_sha}"
          if [[ ! "$core_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Core CI reference must be one full lowercase commit SHA"
            exit 1
          fi
          echo "sha=$core_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## API/Core CI pair"
            echo
            echo "- API: \`${GITHUB_SHA}\`"
            echo "- Core: \`${core_sha}\`"
            if [[ -n "$REQUESTED_CORE_SHA" ]]; then
              echo "- Core source: manual workflow input"
            else
              echo "- Core source: committed .github/ci-refs/core.sha"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Web commit
        id: web-ref
        shell: bash
        run: |
          pinned_web_sha="$(< .github/ci-refs/web.sha)"
          if [[ ! "$pinned_web_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Web CI reference must be one full lowercase commit SHA"
            exit 1
          fi
          echo "sha=$pinned_web_sha" >> "$GITHUB_OUTPUT"
          {
            echo "- Web: \`${pinned_web_sha}\` (committed .github/ci-refs/web.sha)"
          } >> "$GITHUB_STEP_SUMMARY"

  community-d1-shard:
    needs: ci-provenance
    if: needs.ci-provenance.outputs.reuse_merge_group != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install shared service dependencies
        working-directory: services/shared
        run: bun install --frozen-lockfile

      - name: Install community D1 shard dependencies
        working-directory: services/community-d1-shard
        run: bun install --frozen-lockfile

      - name: Typecheck community D1 shard
        working-directory: services/community-d1-shard
        run: bun run check

      - name: Test community D1 shard
        working-directory: services/community-d1-shard
        run: bun run test

  dance-grader:
    name: Dance grader Python
    needs: ci-provenance
    if: needs.ci-provenance.outputs.reuse_merge_group != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.12

      - name: Install dance grader development dependencies
        working-directory: services/dance-grader
        run: uv sync --frozen --extra dev

      - name: Lint dance grader
        working-directory: services/dance-grader
        run: uv run ruff check .

      - name: Check dance grader formatting
        working-directory: services/dance-grader
        run: uv run ruff format --check .

      - name: Test dance grader
        working-directory: services/dance-grader
        run: uv run pytest -q

  story-controlled-inclusion-harness:
    needs: ci-provenance
    if: needs.ci-provenance.outputs.reuse_merge_group != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install controlled-inclusion harness dependencies
        working-directory: services/story-controlled-inclusion-harness
        run: bun install --frozen-lockfile

      - name: Typecheck controlled-inclusion harness
        working-directory: services/story-controlled-inclusion-harness
        run: bun run check

      - name: Test controlled-inclusion transaction model
        working-directory: services/story-controlled-inclusion-harness
        run: bun run test

      - name: Test controlled-inclusion Durable Object
        working-directory: services/story-controlled-inclusion-harness
        run: bun run test:workerd

      - name: Validate staging Worker bundle
        working-directory: services/story-controlled-inclusion-harness
        run: bunx wrangler deploy --dry-run --env staging

  bookings-repository:
    # Real-Postgres tests for the global bookings repositories: provisions
    # PostgreSQL 17 and applies the CANONICAL core b0001 before exercising the repository.
    needs: [ci-provenance, ci-inputs]
    if: needs.ci-provenance.outputs.reuse_merge_group != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Check out core migration source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.ci-inputs.outputs.core_sha }}
          path: core

      - name: Verify Core commit
        working-directory: core
        env:
          EXPECTED_CORE_SHA: ${{ needs.ci-inputs.outputs.core_sha }}
        run: |
          actual_core_sha="$(git rev-parse HEAD)"
          if [[ "$actual_core_sha" != "$EXPECTED_CORE_SHA" ]]; then
            echo "::error::Core checkout mismatch: expected $EXPECTED_CORE_SHA, got $actual_core_sha"
            exit 1
          fi
          echo "Using Core commit $actual_core_sha"

      - name: Link cross-repo file deps
        run: |
          ln -sfn "$GITHUB_WORKSPACE/core" "$GITHUB_WORKSPACE/../core"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install shared dependencies
        working-directory: services/shared
        run: bun install --frozen-lockfile

      - name: Install API dependencies
        working-directory: services/api
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Run bookings repository real-Postgres tests
        working-directory: services/api
        env:
          PIRATE_CORE_REPO: ${{ github.workspace }}/core
          BOOKINGS_REPO_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
          BOOKINGS_PG_CI_REQUIRED: "true"
          REWARD_CAMPAIGN_PG_CI_REQUIRED: "true"
          REWARD_CAMPAIGN_PG_SENTINEL_PATH: "/tmp/reward-campaign-pg-suite-complete"
        run: |
          echo "::group::host-config repository PG"
          rm -f "/tmp/host-config-repository-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/host-config-repository-pg-suite-complete" timeout 120s bun test src/lib/bookings/host-config-repository.pg.test.ts
          test "$(cat "/tmp/host-config-repository-pg-suite-complete")" = "host-config-repository-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::hold repository PG"
          rm -f "/tmp/hold-repository-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/hold-repository-pg-suite-complete" timeout 120s bun test src/lib/bookings/hold-repository.pg.test.ts
          test "$(cat "/tmp/hold-repository-pg-suite-complete")" = "hold-repository-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::booking hold service PG"
          rm -f "/tmp/booking-hold-service-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/booking-hold-service-pg-suite-complete" timeout 120s bun test src/lib/bookings/booking-hold-service.pg.test.ts
          test "$(cat "/tmp/booking-hold-service-pg-suite-complete")" = "booking-hold-service-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::booking read service PG"
          rm -f "/tmp/booking-read-service-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/booking-read-service-pg-suite-complete" timeout 120s bun test src/lib/bookings/booking-read-service.pg.test.ts
          test "$(cat "/tmp/booking-read-service-pg-suite-complete")" = "booking-read-service-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::payment-intent repository PG"
          rm -f "/tmp/payment-intent-repository-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/payment-intent-repository-pg-suite-complete" timeout 120s bun test src/lib/bookings/payment-intent-repository.pg.test.ts
          test "$(cat "/tmp/payment-intent-repository-pg-suite-complete")" = "payment-intent-repository-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::booking finalization repository PG"
          rm -f "/tmp/booking-finalization-repository-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/booking-finalization-repository-pg-suite-complete" timeout 120s bun test src/lib/bookings/booking-finalization-repository.pg.test.ts
          test "$(cat "/tmp/booking-finalization-repository-pg-suite-complete")" = "booking-finalization-repository-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::booking lifecycle repository PG"
          rm -f "/tmp/booking-lifecycle-repository-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/booking-lifecycle-repository-pg-suite-complete" timeout 120s bun test src/lib/bookings/booking-lifecycle-repository.pg.test.ts
          test "$(cat "/tmp/booking-lifecycle-repository-pg-suite-complete")" = "booking-lifecycle-repository-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::booking lifecycle service PG"
          rm -f "/tmp/booking-lifecycle-service-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/booking-lifecycle-service-pg-suite-complete" timeout 120s bun test src/lib/bookings/booking-lifecycle-service.pg.test.ts
          test "$(cat "/tmp/booking-lifecycle-service-pg-suite-complete")" = "booking-lifecycle-service-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::booking settlement cron PG"
          rm -f "/tmp/booking-settlement-cron-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/booking-settlement-cron-pg-suite-complete" timeout 120s bun test src/lib/bookings/booking-settlement-cron.pg.test.ts
          test "$(cat "/tmp/booking-settlement-cron-pg-suite-complete")" = "booking-settlement-cron-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::settlement effect repository PG"
          rm -f "/tmp/settlement-effect-repository-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/settlement-effect-repository-pg-suite-complete" timeout 120s bun test src/lib/bookings/settlement-effect-repository.pg.test.ts
          test "$(cat "/tmp/settlement-effect-repository-pg-suite-complete")" = "settlement-effect-repository-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::booking confirm service PG"
          rm -f "/tmp/booking-confirm-service-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/booking-confirm-service-pg-suite-complete" timeout 120s bun test src/lib/bookings/booking-confirm-service.pg.test.ts
          test "$(cat "/tmp/booking-confirm-service-pg-suite-complete")" = "booking-confirm-service-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::feed booking discovery PG"
          rm -f "/tmp/home-feed-booking-pg-suite-complete"
          BOOKINGS_PG_SENTINEL_PATH="/tmp/home-feed-booking-pg-suite-complete" timeout 120s bun test src/lib/feed/home-feed-booking.pg.test.ts
          test "$(cat "/tmp/home-feed-booking-pg-suite-complete")" = "home-feed-booking-postgres-suite-complete"
          echo "::endgroup::"
          echo "::group::reward campaign credit PG"
          rm -f "$REWARD_CAMPAIGN_PG_SENTINEL_PATH"
          timeout 120s bun test src/lib/rewards/reward-campaign-reconciler.pg.test.ts
          test "$(cat "$REWARD_CAMPAIGN_PG_SENTINEL_PATH")" = "reward-campaign-postgres-suite-complete"
          echo "::endgroup::"

  api-top-level-tests:
    name: top-level-tests (${{ matrix.shard }}/4)
    needs: [ci-provenance, ci-inputs]
    if: needs.ci-provenance.outputs.reuse_merge_group != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Check out Core workspace dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.ci-inputs.outputs.core_sha }}
          path: core

      - name: Link workspace dependencies and test fixtures
        run: |
          ln -sfn "$GITHUB_WORKSPACE/core" "$GITHUB_WORKSPACE/../core"
          ln -sfn "$GITHUB_WORKSPACE/services/api/test-fixtures/db" "$GITHUB_WORKSPACE/../db"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install shared dependencies
        working-directory: services/shared
        run: bun install --frozen-lockfile

      - name: Install API dependencies
        id: install-api-dependencies
        working-directory: services/api
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Run top-level API tests
        shell: bash
        working-directory: services/api
        env:
          PIRATE_CORE_REPO: ${{ github.workspace }}/core
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: 4
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find tests -maxdepth 1 -type f -name '*.test.ts' -print | sort)
          selected=()
          for index in "${!test_files[@]}"; do
            if (( index % TEST_SHARD_COUNT == TEST_SHARD - 1 )); then
              selected+=("${test_files[$index]}")
            fi
          done
          if (( ${#selected[@]} == 0 )); then
            echo "::error::No top-level API tests selected for shard ${TEST_SHARD}/${TEST_SHARD_COUNT}"
            exit 1
          fi
          echo "Shard ${TEST_SHARD}/${TEST_SHARD_COUNT}: ${#selected[@]} files"
          bun run scripts/run-route-tests.ts "${selected[@]}"

  api-core:
    name: api-core
    needs: [ci-provenance, ci-inputs]
    if: needs.ci-provenance.outputs.reuse_merge_group != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # For the bookings production-path test (withRequestControlPlaneClients -> getControlPlaneClient ->
      # real PostgresClientAdapter/PostgresTransactionAdapter), which runs in this full-install job.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Start iron-proxy egress audit
        uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a
        with:
          version: 0.41.0
          egress-rules: egress-rules.yaml
          warn: true

      - name: Link shared database fixtures
        run: |
          ln -sfn "$GITHUB_WORKSPACE/services/api/test-fixtures/db" "$GITHUB_WORKSPACE/../db"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Run repo hygiene checks
        run: |
          node scripts/check-repo-hygiene.mjs
          bun test scripts/check-repo-hygiene.dockerfiles.test.mjs

      - name: Install shared dependencies
        working-directory: services/shared
        run: bun install --frozen-lockfile

      - name: Audit shared dependencies
        working-directory: services/shared
        run: bun audit --audit-level=high

      - name: Typecheck shared package
        working-directory: services/shared
        run: bun run check

      - name: Install contracts dependencies
        working-directory: services/contracts
        run: bun install --frozen-lockfile

      - name: Audit contracts dependencies
        working-directory: services/contracts
        run: bun audit --audit-level=high

      - name: Typecheck generated contracts package
        working-directory: services/contracts
        run: bun run check

      - name: Check out core migration source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.ci-inputs.outputs.core_sha }}
          path: core

      - name: Verify Core commit
        working-directory: core
        env:
          EXPECTED_CORE_SHA: ${{ needs.ci-inputs.outputs.core_sha }}
        run: |
          actual_core_sha="$(git rev-parse HEAD)"
          if [[ "$actual_core_sha" != "$EXPECTED_CORE_SHA" ]]; then
            echo "::error::Core checkout mismatch: expected $EXPECTED_CORE_SHA, got $actual_core_sha"
            exit 1
          fi
          echo "Using Core commit $actual_core_sha"

      - name: Check generated contracts freshness against core spec
        working-directory: services/contracts
        env:
          # Core is checked out at $GITHUB_WORKSPACE/core above. Point the
          # generator at it explicitly. No conditional skip: if core is
          # unavailable, resolveCoreRepoRoot throws and this step fails loudly,
          # rather than silently passing a stale contract (the previous guard
          # tested ../../../specs — a path that never existed and always skipped).
          PIRATE_CORE_REPO: ${{ github.workspace }}/core
        run: bun run check:fresh

      - name: Check community schema guards
        working-directory: services/api
        run: bun run check:community-schema-guards

      - name: Check community schema snapshot freshness
        working-directory: services/api
        env:
          # Regenerate the provisioning snapshot from the core community-template
          # migrations and fail if the committed snapshot drifts (or if any core
          # migration is missing from the recorded ledger). Prevents a stale
          # generated snapshot from provisioning communities with the wrong schema.
          PIRATE_CORE_REPO: ${{ github.workspace }}/core
        run: bun run check:community-schema-snapshot

      - name: Check control-plane migration fixture freshness
        working-directory: services/api
        env:
          PIRATE_CORE_REPO: ${{ github.workspace }}/core
        run: bun run check:control-plane-fixtures

      - name: Install ZKPassport verifier container dependencies
        working-directory: services/zkpassport-verifier-container
        run: bun install --frozen-lockfile

      - name: Audit ZKPassport verifier container dependencies
        working-directory: services/zkpassport-verifier-container
        # Temporary tooling-only exception. Miniflare pins sharp 0.34.5, while
        # the verifier image installs its dedicated production runtime only.
        # Expires 2026-08-05; remove via #699.
        run: bun audit --audit-level=high --ignore GHSA-f88m-g3jw-g9cj

      - name: Typecheck ZKPassport verifier container
        working-directory: services/zkpassport-verifier-container
        run: bun run check

      - name: Test ZKPassport verifier container
        working-directory: services/zkpassport-verifier-container
        run: bun run test

      - name: Install ZKPassport verifier runtime dependencies
        working-directory: services/zkpassport-verifier-runtime
        run: bun install --frozen-lockfile --production

      - name: Audit ZKPassport verifier runtime dependencies
        working-directory: services/zkpassport-verifier-runtime
        run: bun audit --audit-level=high

      - name: Check out Web dependency-audit baseline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: pirate-social-club/web
          ref: ${{ needs.ci-inputs.outputs.web_sha }}
          path: .cross-repo/web

      - name: Link Core repo for cross-repo file deps
        run: |
          ln -sfn "$GITHUB_WORKSPACE/core" "$GITHUB_WORKSPACE/../core"

      - name: Install song preview container dependencies
        working-directory: services/song-preview-container
        run: bun install --frozen-lockfile

      - name: Audit song preview container dependencies
        working-directory: services/song-preview-container
        # Wrangler/Miniflare development-tool exception. Expires 2026-08-05;
        # remove via #699 once Miniflare consumes sharp >=0.35.0.
        run: bun audit --audit-level=high --ignore GHSA-f88m-g3jw-g9cj

      - name: Typecheck song preview container
        working-directory: services/song-preview-container
        run: bun run check

      - name: Test song preview container
        working-directory: services/song-preview-container
        run: bun run test

      - name: Install song preview runtime dependencies
        working-directory: services/song-preview-runtime
        run: bun install --frozen-lockfile --production

      - name: Audit song preview runtime dependencies
        working-directory: services/song-preview-runtime
        run: bun audit --audit-level=high

      - name: Install API dependencies
        working-directory: services/api
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Typecheck API service
        id: typecheck-api
        working-directory: services/api
        run: bun run check

      - name: Lint API service
        id: lint-api
        working-directory: services/api
        run: bun run lint

      - name: Run API unit tests
        id: test-api-unit
        working-directory: services/api
        run: bun run test:unit

      - name: Run production-path real-Postgres tests
        id: test-bookings-production-path
        # Runs after install/core-checkout even if an earlier step (e.g. the pre-existing, unrelated
        # fetch-types typecheck drift) failed, so this bookings coverage is observed on its own merits.
        # If dependency installation failed, this test also fails explicitly
        # instead of disappearing from the required product signal.
        if: always()
        working-directory: services/api
        env:
          PIRATE_CORE_REPO: ${{ github.workspace }}/core
          BOOKINGS_REPO_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
          BOOKINGS_PG_CI_REQUIRED: "true"
          PUBLIC_ARTIFACT_GRANT_PG_CI_REQUIRED: "true"
          HOME_FEED_PG_CI_REQUIRED: "true"
          BOOKINGS_PG_SENTINEL_PATH: "/tmp/host-config-repository-production-path-pg-suite-complete"
        run: |
          rm -f "$BOOKINGS_PG_SENTINEL_PATH"
          bun test src/lib/bookings/host-config-repository.production-path.pg.test.ts
          bun test src/lib/song-artifacts/public-song-artifact-grant-repository.pg.test.ts
          bun test src/lib/feed/home-feed-service.production-path.pg.test.ts
          test "$(cat "$BOOKINGS_PG_SENTINEL_PATH")" = "host-config-repository-production-path-postgres-suite-complete"

      - name: Run API coverage report
        # Report-only: this command enforces no threshold, and coverage instrumentation can be flaky/OOM-prone.
        continue-on-error: true
        timeout-minutes: 10
        working-directory: services/api
        run: bun run coverage

      - name: Audit API dependencies
        id: audit-api-dependencies
        continue-on-error: true
        working-directory: services/api
        # Run after product verification so an audit-client or advisory-service
        # failure cannot erase typecheck, lint, and unit-test signal. The
        # explicit required-step assertion below keeps this audit a hard merge
        # gate.
        #
        run: |
          bun run scripts/audit-bun-lock.ts \
            --mode scheduled \
            --lockfile bun.lock \
            --baseline ../../.cross-repo/web/.github/dependency-audit-baseline.json

      - name: Verify required API core steps
        if: always()
        env:
          API_AUDIT_OUTCOME: ${{ steps.audit-api-dependencies.outcome }}
          API_BOOKINGS_TEST_OUTCOME: ${{ steps.test-bookings-production-path.outcome }}
          API_LINT_OUTCOME: ${{ steps.lint-api.outcome }}
          API_TYPECHECK_OUTCOME: ${{ steps.typecheck-api.outcome }}
          API_UNIT_TEST_OUTCOME: ${{ steps.test-api-unit.outcome }}
        run: |
          test "$API_TYPECHECK_OUTCOME" = "success"
          test "$API_LINT_OUTCOME" = "success"
          test "$API_UNIT_TEST_OUTCOME" = "success"
          test "$API_BOOKINGS_TEST_OUTCOME" = "success"
          test "$API_AUDIT_OUTCOME" = "success"

      - name: Show iron-proxy egress summary
        uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a
        if: always()

  api-route-tests:
    name: route-tests (${{ matrix.shard }}/8)
    needs: [ci-provenance, ci-inputs]
    if: needs.ci-provenance.outputs.reuse_merge_group != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Start iron-proxy egress audit
        uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a
        with:
          version: 0.41.0
          egress-rules: egress-rules.yaml
          warn: true

      - name: Check out Core workspace dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.ci-inputs.outputs.core_sha }}
          path: core

      - name: Link workspace dependencies and test fixtures
        run: |
          ln -sfn "$GITHUB_WORKSPACE/core" "$GITHUB_WORKSPACE/../core"
          ln -sfn "$GITHUB_WORKSPACE/services/api/test-fixtures/db" "$GITHUB_WORKSPACE/../db"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install shared dependencies
        working-directory: services/shared
        run: bun install --frozen-lockfile

      - name: Install API dependencies
        working-directory: services/api
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Run route-test shard
        working-directory: services/api
        env:
          ROUTE_TEST_SHARD: ${{ matrix.shard }}
          ROUTE_TEST_SHARD_COUNT: 8
        run: bun run test:routes

      - name: Show iron-proxy egress summary
        uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a
        if: always()

  api:
    name: api
    if: always()
    needs:
      - api-core
      - api-route-tests
      - api-top-level-tests
      - bookings-repository
      - ci-provenance
      - dance-grader
      - story-controlled-inclusion-harness
    runs-on: ubuntu-latest
    steps:
      - name: Verify API checks
        env:
          API_CORE_RESULT: ${{ needs.api-core.result }}
          API_ROUTE_TESTS_RESULT: ${{ needs.api-route-tests.result }}
          API_TOP_LEVEL_TESTS_RESULT: ${{ needs.api-top-level-tests.result }}
          BOOKINGS_REPOSITORY_RESULT: ${{ needs.bookings-repository.result }}
          DANCE_GRADER_RESULT: ${{ needs.dance-grader.result }}
          REUSE_MERGE_GROUP: ${{ needs.ci-provenance.outputs.reuse_merge_group }}
          STORY_CONTROLLED_INCLUSION_HARNESS_RESULT: ${{ needs.story-controlled-inclusion-harness.result }}
        run: |
          if [[ "$REUSE_MERGE_GROUP" == "true" ]]; then
            test "$API_CORE_RESULT" = "skipped"
            test "$API_ROUTE_TESTS_RESULT" = "skipped"
            test "$API_TOP_LEVEL_TESTS_RESULT" = "skipped"
            test "$BOOKINGS_REPOSITORY_RESULT" = "skipped"
            test "$DANCE_GRADER_RESULT" = "skipped"
            test "$STORY_CONTROLLED_INCLUSION_HARNESS_RESULT" = "skipped"
            echo "Exact-SHA merge-group verification reused; duplicate main-push jobs stayed skipped."
            exit 0
          fi
          test "$API_CORE_RESULT" = "success"
          test "$API_ROUTE_TESTS_RESULT" = "success"
          test "$API_TOP_LEVEL_TESTS_RESULT" = "success"
          test "$BOOKINGS_REPOSITORY_RESULT" = "success"
          test "$DANCE_GRADER_RESULT" = "success"
          test "$STORY_CONTROLLED_INCLUSION_HARNESS_RESULT" = "success"

  cli:
    needs: ci-provenance
    if: needs.ci-provenance.outputs.reuse_merge_group != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Start iron-proxy egress audit
        uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a
        with:
          version: 0.41.0
          egress-rules: egress-rules.yaml
          warn: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install contracts dependencies
        working-directory: services/contracts
        run: bun install --frozen-lockfile

      - name: Audit contracts dependencies
        working-directory: services/contracts
        run: bun audit --audit-level=high

      - name: Install CLI dependencies
        working-directory: services/cli
        run: bun install --frozen-lockfile

      - name: Audit CLI dependencies
        working-directory: services/cli
        run: bun audit --audit-level=high

      - name: Typecheck CLI
        working-directory: services/cli
        run: bun run check

      - name: Run CLI tests
        working-directory: services/cli
        run: bun run test

      - name: Show iron-proxy egress summary
        uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a
        if: always()
