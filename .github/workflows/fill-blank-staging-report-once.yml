name: fill-blank-staging-report-once

on:
  workflow_dispatch:
    inputs:
      api_sha:
        description: API commit containing the audited report runner
        required: true
        default: e8ff2e1be7cb25fbd8458b2b682e8891a1b34f39
        type: string

permissions:
  contents: read
  packages: read

jobs:
  report:
    name: Generate frozen staging fill-blank report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out API
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.api_sha }}

      - name: Read the pinned Core ref
        id: core-ref
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < .github/ci-refs/core.sha)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Core workspace dependency
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: pirate-social-club/core
          ref: ${{ steps.core-ref.outputs.sha }}
          path: core

      - name: Link Core workspace dependency
        shell: bash
        run: ln -sfn "$GITHUB_WORKSPACE/core" "$GITHUB_WORKSPACE/../core"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install shared dependencies
        working-directory: services/shared
        run: bun install --frozen-lockfile

      - name: Install API dependencies
        working-directory: services/api
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Generate read-only staging report
        working-directory: services/api
        env:
          ENVIRONMENT: staging
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: >-
          bun scripts/song-study-fill-blank-report.ts
          --confirmation 'AUDIT FILL BLANK TO STAGING'
          --output "$GITHUB_WORKSPACE/staging-report-en.json"
          --include-say-it-back true
          --include-translation true
          --target-language en

      - name: Upload frozen report artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fill-blank-staging-report-${{ github.run_id }}
          path: staging-report-en.json
          if-no-files-found: error
          retention-days: 3
